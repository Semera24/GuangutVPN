<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuangutVPN</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-border: #1e293b;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 14px;
    }
    .brand h1 { font-size: 1.15rem; color: var(--accent); }
    .brand p { font-size: 0.72rem; color: var(--muted); }
    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 99px;
      font-weight: 700;
    }
    .badge.connected { background: rgba(34,197,94,0.2); color: var(--accent-green); border: 1px solid rgba(34,197,94,0.4); }
    .badge.disconnected { background: rgba(239,68,68,0.2); color: var(--accent-red); border: 1px solid rgba(239,68,68,0.4); }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 0.8rem;
    }
    .stat-row span.label { color: var(--muted); }
    .stat-row span.value { font-weight: 600; font-family: monospace; }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      transition: all 0.15s;
    }
    button:hover { background: #334155; border-color: var(--accent); }
    button.primary { background: #0284c7; border-color: #38bdf8; }
    button.primary:hover { background: #0369a1; }
    button.danger { background: rgba(239,68,68,0.2); border-color: var(--accent-red); color: #fca5a5; }
    select, input {
      width: 100%;
      background: #0f172a;
      color: var(--text);
      border: 1px solid #334155;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      margin-bottom: 8px;
    }
    #status-msg {
      font-size: 0.72rem;
      color: var(--accent);
      min-height: 20px;
      margin-top: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>[VPN] GuangutVPN</h1>
      <p>Universal Browser Extension</p>
    </div>
    <div id="conn-badge" class="badge disconnected">[OFFLINE]</div>
  </header>

  <div class="card">
    <div class="stat-row"><span class="label">Public IP</span><span class="value" id="ext-ip">—</span></div>
    <div class="stat-row"><span class="label">Location</span><span class="value" id="ext-loc">—</span></div>
    <div class="stat-row"><span class="label">Target Mode</span><span class="value" id="ext-mode">Direct</span></div>
  </div>

  <div style="font-size:0.75rem; font-weight:700; margin-bottom:6px; color:var(--muted);">1-CLICK US REGION</div>
  <div class="btn-group">
    <button class="primary" id="btn-us-all">[US] All</button>
    <button id="btn-us-west">[US-West] CA/CO</button>
    <button id="btn-us-central">[US-Central] TX</button>
  </div>

  <div style="font-size:0.75rem; font-weight:700; margin-bottom:6px; color:var(--muted);">COUNTRY &amp; STATE SELECTOR</div>
  <select id="country-picker">
    <option value="US">[US] United States</option>
    <option value="JP">[JP] Japan</option>
    <option value="KR">[KR] South Korea</option>
    <option value="GB">[GB] United Kingdom</option>
    <option value="DE">[DE] Germany</option>
    <option value="FR">[FR] France</option>
  </select>
  <input type="text" id="state-picker" placeholder="Optional US State (e.g. CA, TX, CO)" />

  <div class="btn-group" style="margin-top:6px;">
    <button class="primary" id="btn-connect">>> Connect</button>
    <button class="danger" id="btn-disconnect">[X] Disconnect</button>
  </div>

  <div id="status-msg">Ready. Works on Linux, macOS M1 &amp; Windows.</div>

  <script src="popup.js"></script>
</body>
</html>
